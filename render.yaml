services:
  - type: web
    name: nucladb-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NUCLADB_API_KEY
        generateValue: true
      # Issued API keys go to this bucket object, so they survive redeploys
      # (the free tier has no disk). Leave empty to keep them on local disk.
      - key: NUCLADB_KEYS_S3_URL
        sync: false
      - key: NUCLADB_KEYS_S3_ACCESS_KEY_ID
        sync: false
      - key: NUCLADB_KEYS_S3_SECRET_ACCESS_KEY
        sync: false
