services:
  nucladbd:
    build: .
    ports:
      # Published on this machine only, since auth is off below.
      - "127.0.0.1:9090:9090" # gRPC
      - "127.0.0.1:8080:8080" # REST + /metrics
    volumes:
      - nucladb-data:/data
    environment:
      - PORT=8080 # entrypoint script binds REST here; matches the exposed port above
      - NUCLADB_ALLOW_UNAUTHENTICATED=1 # explicit local-development opt-in
    command:
      - "-dim=128"
      - "-metric=cosine"

volumes:
  nucladb-data:
