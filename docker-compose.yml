services:
  nucladbd:
    build: .
    ports:
      - "9090:9090" # gRPC
      - "8080:8080" # REST + /metrics
    volumes:
      - nucladb-data:/data
    environment:
      - PORT=8080 # entrypoint script binds REST here; matches the exposed port above
    command:
      - "-dim=128"
      - "-metric=cosine"

volumes:
  nucladb-data:
