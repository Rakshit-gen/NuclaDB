syntax = "proto3";

package nucladb.v1;

option go_package = "github.com/Rakshit-gen/nucladb/proto/nucladbv1";

// NuclaDB is a vector similarity search engine: insert vectors with an
// optional metadata payload, then search for the nearest neighbors of a
// query vector under a chosen distance metric.
//
// Every data RPC is tenant-scoped: each tenant_id gets an isolated index
// (its own graph, WAL, and snapshot files on disk), with an independent
// storage quota and request-rate limit. An empty tenant_id resolves to a
// reserved "default" tenant with no quota, so existing single-tenant
// usage needs no changes.
//
// REST is exposed separately via a hand-written gateway in
// internal/api/gateway rather than google.api.http annotations, to avoid
// vendoring the full googleapis proto tree.
service NuclaDB {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc BatchUpsert(BatchUpsertRequest) returns (BatchUpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Count(CountRequest) returns (CountResponse);
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc SetQuota(SetQuotaRequest) returns (SetQuotaResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
}

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  DISTANCE_METRIC_COSINE = 1;
  DISTANCE_METRIC_L2 = 2;
  DISTANCE_METRIC_DOT = 3;
}

// TenantQuota bounds one tenant's resource usage. A zero value for either
// field means unlimited.
message TenantQuota {
  int64 max_vectors = 1;
  double max_qps = 2;
}

message CreateTenantRequest {
  string tenant_id = 1;
  TenantQuota quota = 2;
}

message CreateTenantResponse {}

message Vector {
  string id = 1;
  repeated float values = 2;
  map<string, string> metadata = 3;
  string tenant_id = 4;
}

message InsertRequest {
  Vector vector = 1;
}

message InsertResponse {
  string id = 1;
}

message BatchUpsertRequest {
  repeated Vector vectors = 1;
}

message BatchUpsertResponse {
  int64 upserted = 1;
}

message DeleteRequest {
  string id = 1;
  string tenant_id = 2;
}

message DeleteResponse {
  bool deleted = 1;
}

message MetadataFilter {
  string key = 1;
  string value = 2;
}

message SearchRequest {
  repeated float query = 1;
  int32 top_k = 2;
  DistanceMetric metric = 3;
  int32 ef_search = 4;
  repeated MetadataFilter filters = 5;
  string tenant_id = 6;
}

message ScoredVector {
  string id = 1;
  float score = 2;
  map<string, string> metadata = 3;
}

message SearchResponse {
  repeated ScoredVector matches = 1;
}

message GetRequest {
  string id = 1;
  string tenant_id = 2;
}

// For cosine indexes the stored vector is scaled to unit length, so that
// is what comes back.
message GetResponse {
  Vector vector = 1;
}

// List pages through a tenant's ids in ascending numeric order.
message ListRequest {
  string tenant_id = 1;
  // next_page_token from the previous response; empty for the first page.
  string page_token = 2;
  // At most 1000; 0 means 100.
  int32 page_size = 3;
}

message ListResponse {
  repeated string ids = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

message CountRequest {
  string tenant_id = 1;
}

message CountResponse {
  int64 count = 1;
}

// Replaces the vector's whole metadata map; an empty map clears it.
message UpdateMetadataRequest {
  string id = 1;
  map<string, string> metadata = 2;
  string tenant_id = 3;
}

message UpdateMetadataResponse {}

message DeleteTenantRequest {
  string tenant_id = 1;
}

message DeleteTenantResponse {}

message SetQuotaRequest {
  string tenant_id = 1;
  TenantQuota quota = 2;
}

message SetQuotaResponse {}

message ListTenantsRequest {}

message TenantInfo {
  string tenant_id = 1;
  int64 vector_count = 2;
  TenantQuota quota = 3;
}

message ListTenantsResponse {
  repeated TenantInfo tenants = 1;
}
