name: keepalive

# Render's free tier spins the demo down after 15 minutes idle, and the
# first request after that eats a ~30s cold start. Pinging it well inside
# that window keeps it warm. GitHub's cron scheduler doesn't guarantee the
# exact minute, so this is best-effort, not a strict 5-minute SLA.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the demo's health endpoint
        run: curl -fsS https://nucladb-demo.onrender.com/metrics -o /dev/null
