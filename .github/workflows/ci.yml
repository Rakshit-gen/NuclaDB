name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet ./...
      - name: build wasm demo
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - name: test
        run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the mcp test uses a stand-in embedder, so skip the [mcp] extra's torch
      - name: install
        run: pip install ./clients/python 'mcp>=2.3,<3'
      - name: client smoke test
        run: python clients/python/tests/smoke_test.py
      - name: mcp server test
        run: python clients/python/tests/mcp_test.py
